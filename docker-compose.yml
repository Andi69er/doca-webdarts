# Lokaler / einfacher Server-Betrieb. Für Produktion einen Reverse-Proxy
# (Caddy/Traefik/nginx) mit TLS davorsetzen – WebRTC & getUserMedia brauchen HTTPS.
services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8787
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      RESULTS_FILE: /app/data/results.jsonl
    volumes:
      - webdarts-data:/app/data
    ports:
      - "8787:8787"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SERVER_URL: ${PUBLIC_SERVER_URL:-http://localhost:8787}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  webdarts-data:
