# Render-Konfiguration für den Webdarts-Spielserver.
# (Der bestehende Service "doca-webdarts" nutzt diese Werte – Build- und
#  Start-Command sind im Dashboard entsprechend zu setzen.)
services:
  - type: web
    name: doca-webdarts
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://www.doca.at
      - key: WEBDARTS_SECRET
        sync: false
      - key: WEBDARTS_MEMBERS_URL
        value: https://www.doca.at/webspiele/webdarts/members.php
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # 3K-Write-back (Ergebnis-Rückschreibung) - echtes Vereinskonto mit
      # Schreibrechten, siehe Memory webdarts-3k-tournament-integration.md.
      # Ohne diese vier ist der Write-back deaktiviert (nur lesen geht weiter).
      - key: THREEK_USERNAME
        sync: false
      - key: THREEK_PASSWORD
        sync: false
      - key: THREEK_MANDANT_KEY
        value: "168"
      - key: THREEK_MANDANT_DATABASE
        value: PROD_3
      # PORT wird von Render automatisch gesetzt.
